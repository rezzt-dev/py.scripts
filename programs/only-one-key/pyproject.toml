[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "only-one-key"
version = "2.0.0"
description = "Gestor de contrasenas personal en consola."
authors = [{ name = "rezzt.dev" }]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/only_one_key"]
