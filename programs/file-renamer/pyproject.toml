[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-file-renamer"
version = "1.0.0"
description = "Herramienta CLI para renombrar masivamente los archivos de una carpeta."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "SimpleFileRenamer Contributors" },
]
keywords = ["cli", "rename", "files", "bulk", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
simple-file-renamer = "simple_file_renamer.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/simple-file-renamer"
Repository = "https://github.com/yourusername/simple-file-renamer"
Issues = "https://github.com/yourusername/simple-file-renamer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_file_renamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
